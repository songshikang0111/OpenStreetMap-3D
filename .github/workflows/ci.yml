name: local-toolchain
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Phase-one tests
        run: npm test
      - name: Workspace build and tests
        run: npm run test:packages
      - name: Type checks
        run: npm run test:types
      - name: Build
        run: npm run build
      - run: node bin/city.js --help --json
      - name: Root package file list
        run: npm pack --ignore-scripts --dry-run
      - name: Workspace package file lists
        run: node scripts/phase2-pack-check.mjs
      - name: Static performance budget (tile draw calls and sizes, map bundle size)
        if: matrix.os == 'ubuntu-latest'
        run: |
          node apps/demo/build-tiles.mjs beijing-cbd-grow-9 kyoto-gion-grow-9
          npm run build:map-bundle
          npm run check:static-budget
